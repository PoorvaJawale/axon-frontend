name: axon-local-staging
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: axon_staging
      POSTGRES_USER: axon_staging_admin
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Run local-staging prepare}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../../.cache/staging/postgres:/var/lib/postgresql/data
      - ../../.cache/staging/init.sql:/docker-entrypoint-initdb.d/001-axon.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon_staging_admin -d axon_staging"]
      interval: 5s
      timeout: 3s
      retries: 30
  n8n:
    image: n8nio/n8n:2.45.7@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
    ports:
      - "127.0.0.1:5688:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5688
      N8N_WEBHOOK_URL: http://localhost:5688/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${STAGING_N8N_KEY:?Run local-staging prepare}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_TIMEOUT: "120"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${STAGING_RUNNER_TOKEN:?Run local-staging prepare}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "5"
      N8N_PAYLOAD_SIZE_MAX: "1"
      EXECUTIONS_TIMEOUT: "120"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
    volumes:
      - ../../.cache/staging/n8n:/home/node/.n8n
      - ../workflows:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
  runners:
    image: n8nio/runners:2.45.7@sha256:2f07088829b6a1df2b6a84746bb8b32c1eaef270315fb5466aa01b1045e9b300
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${STAGING_RUNNER_TOKEN:?Run local-staging prepare}
      N8N_RUNNERS_MAX_CONCURRENCY: "4"
      N8N_RUNNERS_TASK_TIMEOUT: "120"
    volumes:
      - ./task-runners.json:/etc/n8n-task-runners.json:ro
    depends_on:
      - n8n
