name: Independent service check
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
jobs:
  health:
    if: ${{ vars.AXON_ENABLE_SCHEDULED_MONITOR != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24 action runtime
        with:
          node-version: 24
      - run: node scripts/check-deployment.cjs
        env:
          AXON_MONITOR_WEB_URL: ${{ vars.AXON_MONITOR_WEB_URL || 'https://axon-frontend-vxa8.vercel.app/api/health' }}
          AXON_MONITOR_STATUS_URL: ${{ vars.AXON_MONITOR_STATUS_URL || 'https://axon-frontend-vxa8.vercel.app/api/status' }}
